name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.32"
      - run: uv python install 3.12
      - run: uv sync --all-groups
      - name: Unit, conformance and SAMPLE_MODE end-to-end tests
        run: uv run pytest -q
      - name: requirements.txt (the pip route) matches uv.lock
        run: |
          set -e
          uv export --frozen --no-dev --no-group prep --no-hashes --no-emit-project -o /tmp/req.txt
          diff <(grep -E '^[A-Za-z0-9]' /tmp/req.txt) <(grep -E '^[A-Za-z0-9]' requirements.txt)
          echo "requirements.txt is in sync with uv.lock"
      - name: Secrets scan (committed files must carry no keys)
        run: |
          set -e
          if git grep -nE "nvapi-[A-Za-z0-9_-]{10,}|sk-[A-Za-z0-9]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY" -- . ':!uv.lock'; then
            echo "secret-like string found"; exit 1; fi
          test ! -f .env || (echo ".env must not be committed" && exit 1)
      - name: Fresh-clone run with no .env, no network (SAMPLE_MODE fallback)
        run: |
          set -e
          rm -f .env
          uv run python run.py --input input_examples/01_supplier_overlap.json > /tmp/out.json
          python3 -c "import json; d=json.load(open('/tmp/out.json')); assert d['status']=='success', d; print('ok', d['execution_time_seconds'], 's')"
          test -f logs/trace-example-01.jsonl
      - name: Judges' self-test - copy .env.example to .env, ask NEW questions with no options
        run: |
          set -e
          cp .env.example .env
          uv run python run.py --run-id judge-new-1 --query "Which Guildford contracts end within a year of vesting day?" > /tmp/j1.json
          uv run python run.py --run-id judge-new-2 --query "Which companies are paid by all three councils?" > /tmp/j2.json
          python3 -c "
          import json
          j1 = json.load(open('/tmp/j1.json')); j2 = json.load(open('/tmp/j2.json'))
          assert j1['status'] == 'success' and j2['status'] == 'success', (j1.get('error'), j2.get('error'))
          assert 'plus or minus 365 days' in j1['output']['summary'], j1['output']['summary'][:200]
          print('ok: a copied .env.example runs in SAMPLE_MODE and answers questions not in the examples')"
          rm -f .env

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t vesting-day:ci .
      - name: Run the container with NO network and no credentials, hit POST /run from inside it
        run: |
          set -e
          docker run -d --rm --name vd --network none vesting-day:ci
          for i in $(seq 1 40); do docker exec vd python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)" && break || sleep 1; done
          docker exec -i vd python3 - <<'PY'
          import json, urllib.request
          body = json.dumps({"run_id": "ci-001", "input": {"query": "Which contracts end within six months of vesting day?"}, "options": {"sample_mode": True}}).encode()
          req = urllib.request.Request("http://127.0.0.1:8000/run", data=body, headers={"Content-Type": "application/json"})
          d = json.loads(urllib.request.urlopen(req, timeout=120).read())
          assert d["status"] == "success", d
          print(d["output"]["summary"][:300])
          page = urllib.request.urlopen("http://127.0.0.1:8000/", timeout=10).read().decode()
          assert "VESTING DAY" in page and "/trace/" in page, "web page not served"
          t = json.loads(urllib.request.urlopen("http://127.0.0.1:8000/trace/ci-001", timeout=10).read())
          assert len(t["events"]) > 5, t
          print("web page and trace route ok:", len(t["events"]), "trace events")
          hard = next(a for a in d["output"]["artifacts"] if a["type"] == "table")
          csv_text = urllib.request.urlopen("http://127.0.0.1:8000" + hard["export"]["url"], timeout=10).read().decode("utf-8-sig")
          assert csv_text.count("\n") == hard["count"] + 1, (hard["count"], csv_text.count("\n"))
          ev = json.loads(urllib.request.urlopen("http://127.0.0.1:8000/evidence", timeout=10).read())
          assert ev["runs"] and all(r["live"] for r in ev["runs"]), ev
          print("full contract list as CSV:", hard["count"], "rows; recorded live runs served:", [r["run_id"] for r in ev["runs"]])
          PY
          n=$(docker logs vd 2>&1 | grep -c '"agent_name"' || true); echo "trace lines in container logs: $n"; test "$n" -gt 5
          docker stop vd
